# uConsole: one 720x1280 DSI panel, included from config. DSI-1 on a CM4,
# DSI-2 on a CM5.
#
# No transform: the panel's device tree says it is turned 90 degrees, and sway
# turns it back by itself, to 1280x720. No mode: it has only the one. An HDMI
# monitor keeps its own.
output * {
    scale 1
    # Until pt35d starts and paints the theme's background.
    background #0a1310 solid_color
}

# The screen less the 44px bar, and dialogs a little inside it.
set $float_max 1280 x 676
set $dialog_size 1200 630
set $portal_size 1240 650

# X sends F19 (pt35d's gamepad.rs): the Monitor app, btop. Through pt35d, so
# it opens on its own workspace, or comes to the front if it is open.
bindsym --no-repeat F19 exec pt35ctl launch monitor
