# PocketTerm35: one 640x480 HDMI panel, included from config.
#
# The name is usually HDMI-A-1 but the Pi 5 has two ports: match all.
output * {
    mode 640x480
    scale 1
    # Until pt35d starts and paints the theme's background.
    background #0a1310 solid_color
}

# The screen less the 34px bar, and dialogs a little inside it.
set $float_max 640 x 446
set $dialog_size 600 420
set $portal_size 620 430
