# The uConsole's sizes, merged over ../theme.toml when pt35-session finds a
# uConsole. Its panel is 5" at 1280x720, about 11.6 px/mm against the
# PocketTerm35's 9, so every size is 1.3 times larger: a row is the same 5.5mm
# under the thumb. Colours come from ../theme.toml.

[font]
size_bar        = 19.0
size_menu       = 29.0
size_title      = 31.0
size_hint       = 21.0

[bar]
height        = 44
padding_x     = 13

[menu]
# 720 - 44 (bar) - 60 (header) - 60 (hints) = 556px of body: eight rows.
rows_visible  = 8
row_height    = 64
padding_x     = 18
header_height = 60
hint_height   = 60
columns       = 5
tile_height   = 110
gap           = 13
scrollbar_width = 10
side_width    = 192

[icons]
size_bar      = 24
size_tile     = 42
size_row      = 32

# 24px at 40 repeats a second crosses the 1280px panel in 1.3 seconds. The
# trackball is quicker, and is there too.
[pointer]
step          = 24
cursor_size   = 24
